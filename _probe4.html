<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>probe</title>
<style>html,body,#host{height:100%;margin:0}#host{border:0;width:100%;display:block}</style>
</head>
<body>
<iframe id="host" src="index.html"></iframe>
<script>
var act = new URLSearchParams(location.search).get('act') || '';
var f = document.getElementById('host');
f.addEventListener('load', function () {
  var w = f.contentWindow, d = f.contentDocument;
  function dbl(el) {
    ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click', 'dblclick'].forEach(function (t) {
      el.dispatchEvent(new w.MouseEvent(t, { bubbles: true, cancelable: true, view: w, detail: 2 }));
    });
  }
  function click(el) { el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, cancelable: true, view: w })); }
  setTimeout(function () {
    dbl(d.querySelector('.desk-icon[data-app="music"]'));
    if (act === 'maxmusic') {
      setTimeout(function () {
        var win = d.querySelector('#winLayer .win');
        click(win.querySelector('.tb-max'));
      }, 500);
    }
  }, 600);
});
</script>
</body>
</html>
